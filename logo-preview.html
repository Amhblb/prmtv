<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Moirai — Logo</title>
  <style>
    :root { --ink: #0A0A0A; --paper: #FAF8F4; --night: #0F1B3D; --gold: #C4A961; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      padding: 56px 64px 28px;
      border-bottom: 1px solid #e6e2d8;
    }
    header h1 {
      margin: 0;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    header p {
      margin: 8px 0 0;
      color: #6B6B6B;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #e6e2d8;
    }
    .tile {
      background: var(--paper);
      padding: 72px 64px;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
    }
    .tile.dark  { background: var(--ink);   color: #FAF8F4; }
    .tile.night { background: var(--night); color: #FAF8F4; }

    .label {
      margin-top: 40px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .lockup-svg { width: 80%; max-width: 520px; height: auto; }
    .lockup-svg.lg { max-width: 640px; }
    .mark-svg { display: block; }
    .mark-svg.lg { width: 200px; height: 200px; }
    .mark-svg.md { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <header>
    <h1>MOIRAI &middot; LOGO</h1>
    <p>Wordmark drawn as spun threads &mdash; same stroke language as the mark</p>
  </header>

  <div class="grid">

    <!-- Mark, light -->
    <div class="tile">
      <svg class="mark-svg lg" viewBox="0 0 100 100" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
        <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
        <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
        <circle cx="50" cy="68" r="1.4" fill="#0A0A0A" stroke="none" />
      </svg>
      <div class="label">The Mark</div>
    </div>

    <!-- Mark, dark -->
    <div class="tile dark">
      <svg class="mark-svg lg" viewBox="0 0 100 100" fill="none" stroke="#FAF8F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
        <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
        <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
        <circle cx="50" cy="68" r="1.4" fill="#FAF8F4" stroke="none" />
      </svg>
      <div class="label">Inverted</div>
    </div>

    <!-- Primary lockup, light -->
    <div class="tile">
      <svg class="lockup-svg lg" viewBox="0 0 540 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(8, 8)" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
          <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
          <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
          <circle cx="50" cy="68" r="1.4" fill="#0A0A0A" stroke="none" />
        </g>
        <line x1="118" y1="22" x2="118" y2="78" stroke="#0A0A0A" stroke-width="0.6" opacity="0.25" />
        <g transform="translate(148, 18)" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 2 64 C 2 40, 2 14, 4 4 C 14 22, 22 38, 30 50 C 38 38, 46 22, 56 4 C 58 14, 58 40, 58 64" />
          <ellipse cx="108" cy="34" rx="24" ry="30" />
          <path d="M 162 4 L 162 64" />
          <path d="M 198 64 L 198 4 L 224 4 C 244 4, 244 32, 224 32 L 198 32" />
          <path d="M 218 32 L 246 64" />
          <path d="M 280 64 C 286 46, 296 22, 306 4 C 316 22, 326 46, 332 64" />
          <path d="M 291 42 L 321 42" />
          <path d="M 366 4 L 366 64" />
        </g>
      </svg>
      <div class="label">Primary Lockup</div>
    </div>

    <!-- Lockup, night + gold -->
    <div class="tile night">
      <svg class="lockup-svg lg" viewBox="0 0 540 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(8, 8)" fill="none" stroke="#C4A961" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
          <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
          <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
          <circle cx="50" cy="68" r="1.4" fill="#C4A961" stroke="none" />
        </g>
        <line x1="118" y1="22" x2="118" y2="78" stroke="#C4A961" stroke-width="0.6" opacity="0.5" />
        <g transform="translate(148, 18)" fill="none" stroke="#FAF8F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 2 64 C 2 40, 2 14, 4 4 C 14 22, 22 38, 30 50 C 38 38, 46 22, 56 4 C 58 14, 58 40, 58 64" />
          <ellipse cx="108" cy="34" rx="24" ry="30" />
          <path d="M 162 4 L 162 64" />
          <path d="M 198 64 L 198 4 L 224 4 C 244 4, 244 32, 224 32 L 198 32" />
          <path d="M 218 32 L 246 64" />
          <path d="M 280 64 C 286 46, 296 22, 306 4 C 316 22, 326 46, 332 64" />
          <path d="M 291 42 L 321 42" />
          <path d="M 366 4 L 366 64" />
        </g>
      </svg>
      <div class="label">Editorial &middot; Night + Gold</div>
    </div>

    <!-- Stacked lockup -->
    <div class="tile">
      <svg class="mark-svg md" viewBox="0 0 100 100" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
        <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
        <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
        <circle cx="50" cy="68" r="1.4" fill="#0A0A0A" stroke="none" />
      </svg>
      <div style="height: 28px"></div>
      <svg style="width: 280px; height: auto;" viewBox="0 0 400 70" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(2, 2)">
          <path d="M 2 64 C 2 40, 2 14, 4 4 C 14 22, 22 38, 30 50 C 38 38, 46 22, 56 4 C 58 14, 58 40, 58 64" />
          <ellipse cx="108" cy="34" rx="24" ry="30" />
          <path d="M 162 4 L 162 64" />
          <path d="M 198 64 L 198 4 L 224 4 C 244 4, 244 32, 224 32 L 198 32" />
          <path d="M 218 32 L 246 64" />
          <path d="M 280 64 C 286 46, 296 22, 306 4 C 316 22, 326 46, 332 64" />
          <path d="M 291 42 L 321 42" />
          <path d="M 366 4 L 366 64" />
        </g>
      </svg>
      <div class="label">Stacked &middot; for vertical contexts</div>
    </div>

    <!-- App icon -->
    <div class="tile">
      <div style="width:200px; height:200px; border-radius:44px; background:#0A0A0A; display:flex; align-items:center; justify-content:center; box-shadow:0 24px 48px rgba(0,0,0,0.15);">
        <svg style="width:120px;height:120px;" viewBox="0 0 100 100" fill="none" stroke="#C4A961" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 18 84 C 20 60, 24 36, 32 14 C 38 38, 44 58, 50 68" />
          <path d="M 32 14 C 38 38, 44 58, 50 68 C 56 58, 62 38, 68 14" />
          <path d="M 50 68 C 56 58, 62 38, 68 14 C 76 36, 80 60, 82 84" />
          <circle cx="50" cy="68" r="1.4" fill="#C4A961" stroke="none" />
        </svg>
      </div>
      <div class="label">App Icon</div>
    </div>

  </div>
</body>
</html>
